<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castle Rush — Leaderboard</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
  :root{
    --stone:#15131A; --stone-raised:#1D1A24; --panel:#221E2C; --panel-line:#362F42;
    --parchment:#EDE7DA; --parchment-dim:#9C93A8; --ember:#FF7A45; --ember-dim:#7A3D22;
    --gold:#E3B341; --danger:#E85C5C;
    --display:'Space Grotesk', sans-serif; --mono:'JetBrains Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--stone);color:var(--parchment);font-family:var(--display);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:28px 20px 60px;
    background-image:radial-gradient(circle at 12% 0%, rgba(255,122,69,0.07), transparent 42%),
                     radial-gradient(circle at 88% 8%, rgba(139,124,246,0.07), transparent 42%);
  }
  a{color:inherit;text-decoration:none;}
  .hidden{display:none !important;}
  .wrap{width:100%;max-width:720px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;}
  .brand{display:flex;align-items:center;gap:16px;}
  .logo-img{display:block;height:68px;width:auto;}
  .title{font-size:26px;font-weight:700;letter-spacing:-0.02em;}
  .title small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--parchment-dim);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:14px;
    padding:10px 18px;border-radius:9px;cursor:pointer;border:1px solid var(--panel-line);background:var(--panel);color:var(--parchment);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.primary{background:linear-gradient(180deg,#FF9463,var(--ember));border-color:var(--ember-dim);color:#2A1206;}

  .controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px;}
  .seg{display:inline-flex;gap:4px;background:var(--stone);border:1px solid var(--panel-line);border-radius:10px;padding:4px;}
  .seg button{
    font-family:var(--display);font-weight:600;font-size:13px;color:var(--parchment-dim);background:none;border:none;
    border-radius:7px;padding:8px 16px;cursor:pointer;transition:background .15s,color .15s;
  }
  .seg button:hover{color:var(--parchment);}
  .seg button.active{background:var(--panel);color:var(--parchment);box-shadow:0 0 0 1px var(--panel-line);}
  .seg.dur button.active{color:var(--ember);box-shadow:0 0 0 1px var(--ember-dim);}

  .board{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;overflow:hidden;}
  .row{display:grid;grid-template-columns:52px 1fr 80px 90px;align-items:center;gap:8px;padding:13px 20px;border-bottom:1px solid rgba(0,0,0,0.3);font-family:var(--mono);font-size:14px;}
  .row:last-child{border-bottom:none;}
  .row.head{background:var(--stone-raised);color:var(--parchment-dim);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;padding-top:11px;padding-bottom:11px;}
  .row .rk{color:var(--parchment-dim);}
  .row .nm{font-family:var(--display);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0;}
  .row .nm .nm-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;}
  .row .acc{text-align:right;color:var(--parchment-dim);}
  .row .wp{text-align:right;font-weight:800;font-size:16px;color:var(--gold);}
  .row.r1{background:linear-gradient(90deg,var(--gold),var(--ember));color:#fff;}
  .row.r2{background:linear-gradient(90deg,var(--ember),#D9552C);color:#fff;}
  .row.r3{background:linear-gradient(90deg,#D9552C,#B23B3B);color:#fff;}
  .row.r1 .rk,.row.r2 .rk,.row.r3 .rk,.row.r1 .acc,.row.r2 .acc,.row.r3 .acc,.row.r1 .wp,.row.r2 .wp,.row.r3 .wp{color:#fff;}
  .row.r1 .rk,.row.r2 .rk,.row.r3 .rk{font-weight:800;}
  .row.me{box-shadow:inset 3px 0 0 var(--gold);}
  .row:not(.head):not(.r1):not(.r2):not(.r3).me{background:rgba(227,179,65,0.08);}
  .you-tag{flex:none;font-family:var(--mono);font-size:10px;font-weight:700;line-height:1;color:var(--gold);border:1px solid rgba(227,179,65,0.5);border-radius:10px;padding:3px 7px;}
  .row.r1 .you-tag,.row.r2 .you-tag,.row.r3 .you-tag{color:#fff;border-color:rgba(255,255,255,0.7);}

  .state{padding:44px 20px;text-align:center;color:var(--parchment-dim);font-size:14px;line-height:1.6;}
  .state b{color:var(--parchment);display:block;font-size:16px;margin-bottom:6px;}
  .you-card,.cta{
    margin-top:16px;padding:14px 18px;border-radius:12px;font-size:14px;text-align:center;
    background:var(--panel);border:1px solid var(--panel-line);color:var(--parchment-dim);
  }
  .you-card b{color:var(--gold);font-family:var(--mono);}
  .cta a{color:var(--ember);text-decoration:underline;text-underline-offset:3px;font-weight:600;}
  .note{margin-top:18px;text-align:center;font-family:var(--mono);font-size:11px;color:#6F6781;}

  @media(max-width:560px){
    .row{grid-template-columns:40px 1fr 70px;padding:12px 14px;}
    .row .acc{display:none;}
    .logo-img{height:52px;}
    .title{font-size:21px;}
  }
</style>
</head>

  </div>

  <div class="controls">
    <div class="seg dur" id="durSeg">
      <button data-dur="15" class="active">15s</button>
      <button data-dur="30">30s</button>
      <button data-dur="60">60s</button>
    </div>
    <div class="seg" id="scopeSeg">
      <button data-scope="week" class="active">Last 7 days</button>
      <button data-scope="all">All time</button>
    </div>
  </div>

  <div class="board" id="board"><div class="state">Loading&hellip;</div></div>
  <div class="you-card hidden" id="youCard"></div>
  <div class="cta hidden" id="cta">Playing as a guest? <a href="index.html">Sign up</a> to save your runs and appear here.</div>
  <div class="note">Each player appears once, with their best run. Ties go to the higher accuracy.</div>
</div>

<script>
  (function () {
    var A = window.CR_AUTH;
    var $ = function (id) { return document.getElementById(id); };
    var board = $('board'), youCard = $('youCard'), cta = $('cta');
    var dur = 15, scope = 'week', myName = null, signedIn = false, token = 0;

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function state(title, text) {
      board.textContent = '';
      var d = el('div', 'state');
      d.appendChild(el('b', null, title));
      d.appendChild(document.createTextNode(text));
      board.appendChild(d);
    }

    function render(rows, mine) {
      board.textContent = '';
      youCard.classList.add('hidden');
      if (!rows.length) {
        state('No runs on this board yet', scope === 'week' ? 'Set a time in the last 7 days and you could be first.' : 'Be the first to set a time.');
      } else {
        var head = el('div', 'row head');
        ['#', 'Player', 'Acc', 'WPM'].forEach(function (t, i) {
          var c = el('span', i > 1 ? 'acc' : '', t);
          if (i === 3) c.style.textAlign = 'right';
          head.appendChild(c);
        });
        board.appendChild(head);
        var inList = false;
        rows.forEach(function (r) {
          var isMe = myName && r.username && r.username.toLowerCase() === myName.toLowerCase();
          if (isMe) inList = true;
          var row = el('div', 'row' + (r.rank <= 3 ? ' r' + r.rank : '') + (isMe ? ' me' : ''));
          row.appendChild(el('span', 'rk', String(r.rank)));
          var nm = el('span', 'nm');
          nm.appendChild(el('span', 'nm-text', r.username));
          if (isMe) nm.appendChild(el('span', 'you-tag', 'YOU'));
          row.appendChild(nm);
          row.appendChild(el('span', 'acc', r.accuracy + '%'));
          row.appendChild(el('span', 'wp', String(r.wpm)));
          board.appendChild(row);
        });
        if (signedIn && mine && !inList) {
          youCard.classList.remove('hidden');
          youCard.textContent = 'Your rank: ';
          youCard.appendChild(el('b', null, '#' + mine.rank));
          youCard.appendChild(document.createTextNode(' with ' + mine.wpm + ' wpm'));
        }
      }
      if (signedIn && !mine) {
        youCard.classList.remove('hidden');
        youCard.textContent = "You haven't set a " + dur + 's time ' + (scope === 'week' ? 'this week' : 'yet') + '. Play a run to get on the board.';
      }
    }

    function load() {
      var mine = ++token;
      youCard.classList.add('hidden');
      state('Loading\u2026', '');
      var since = scope === 'week' ? A.weekStart() : null;
      Promise.all([
        A.leaderboard(dur, since, 25),
        signedIn ? A.myRank(dur, since).catch(function () { return null; }) : Promise.resolve(null)
      ]).then(function (res) {
        if (mine !== token) return;   // a newer click already replaced this request
        render(res[0], res[1]);
      }).catch(function (err) {
        if (mine !== token) return;
        console.error(err);
        state("Couldn't load the leaderboard", 'Please try again in a moment.');
      });
    }

    function wire(segId, attr, setter) {
      $(segId).addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        $(segId).querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
        setter(b.dataset[attr]);
        load();
      });
    }
    wire('durSeg', 'dur', function (v) { dur = parseInt(v, 10); });
    wire('scopeSeg', 'scope', function (v) { scope = v; });

    if (!A || !A.configured) {
      state('Leaderboard unavailable', 'Accounts are not connected yet, so there are no scores to show.');
      return;
    }
    A.getSession().then(function (session) {
      if (session) { signedIn = true; myName = A.displayName(session.user); }
      else { cta.classList.remove('hidden'); }
      load();
    });
  })();
</script>
