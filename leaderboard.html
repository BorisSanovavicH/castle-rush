<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard · TypeBound</title>
<meta name="description" content="TypeBound — Your Skill. Your Climb. Competitive typing tests with 15, 30 and 60 second runs and live leaderboards.">
<meta name="theme-color" content="#0B0D17">
<meta property="og:title" content="TypeBound — Your Skill. Your Climb.">
<meta property="og:description" content="Competitive typing tests with live leaderboards.">
<meta property="og:type" content="website">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; padding: 18px 20px 60px; }
  .wrap { width: 100%; max-width: 760px; }
  .app-header { max-width: 760px; }
  .page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 18px; }
  .page-title small { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--text-2); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }

  .controls-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 16px; }

  .board { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-panel); }
  .row {
    position: relative; display: grid; grid-template-columns: 56px 1fr 80px 90px; align-items: center; gap: 8px;
    padding: 13px 20px; border-bottom: 1px solid rgba(43, 49, 80, 0.7); font-family: var(--font-mono); font-size: 14px;
  }
  .row { min-height: 52px; }
  .row:last-child { border-bottom: none; }
  .row.head { background: var(--bg-2); color: var(--text-2); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; padding-top: 11px; padding-bottom: 11px; }
  .row .rk { color: var(--text-2); }
  .row .nm { font-family: var(--font-ui); font-weight: 600; font-size: 15px; color: var(--text); display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row .nm .nm-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
  .row .acc { text-align: right; color: var(--text-2); }
  .row .wp { text-align: right; font-weight: 800; font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }

  /* top three: soft brand tint, accent bar on the left, and a rank badge */
  .row.r1, .row.r2, .row.r3 { background: linear-gradient(90deg, rgba(56, 189, 248, 0.14), rgba(139, 92, 246, 0.08) 55%, transparent); }
  .row.r1::before, .row.r2::before, .row.r3::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--grad); }
  .row.r2::before { opacity: .7; }
  .row.r3::before { opacity: .45; }
  .row.r1 .rk, .row.r2 .rk, .row.r3 .rk {
    display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px;
    font-weight: 800; color: #0B0D17; background: var(--grad);
  }
  .row.r2 .rk { opacity: .85; }
  .row.r3 .rk { opacity: .7; }
  .row.r1 .wp { color: var(--blue); }
  .row.me:not(.r1):not(.r2):not(.r3) { background: rgba(56, 189, 248, 0.07); }
  .row.me::after { content: ''; position: absolute; inset: 0; border: 1px solid rgba(56, 189, 248, 0.45); pointer-events: none; }
  .you-tag {
    flex: none; font-family: var(--font-mono); font-size: 10px; font-weight: 700; line-height: 1; color: var(--blue);
    border: 1px solid rgba(56, 189, 248, 0.55); border-radius: 999px; padding: 3px 7px;
  }

  .state { padding: 44px 20px; text-align: center; color: var(--text-2); font-size: 14px; line-height: 1.6; }
  .state b { color: var(--text); display: block; font-size: 16px; margin-bottom: 6px; }
  .you-card, .cta { margin-top: 16px; padding: 14px 18px; border-radius: var(--radius); font-size: 14px; text-align: center; background: var(--card); border: 1px solid var(--border); color: var(--text-2); }
  .you-card b { color: var(--blue); font-family: var(--font-mono); }
  .cta a { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
  .note { margin-top: 18px; text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

  @media (max-width: 560px) {
    .row { grid-template-columns: 44px 1fr 70px; padding: 12px 14px; }
    .row .acc { display: none; }
    .page-title { font-size: 23px; }
    .header-actions { width: auto; margin-left: auto; }
  }
</style>
</head>
<body>

  <header class="app-header">
    <a class="brand" href="play.html" aria-label="TypeBound home">
      <img class="brand-mark" src="typebound-mark.png" alt="" width="48" height="44">
      <img class="brand-word" src="typebound-wordmark.png" alt="TypeBound" width="147" height="20">
    </a>
    <span class="mode-pill">Leaderboard</span>
    <div class="header-actions">
      <a class="btn primary sm" href="play.html">Play</a>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title"><small>top typists</small>Leaderboard</h1>

    <div class="controls-row">
      <div class="segmented" id="durSeg" role="group" aria-label="Test duration">
        <button class="btn active" data-dur="15">15s</button>
        <button class="btn" data-dur="30">30s</button>
        <button class="btn" data-dur="60">60s</button>
      </div>
      <div class="segmented" id="scopeSeg" role="group" aria-label="Time range">
        <button class="btn active" data-scope="week">Last 7 days</button>
        <button class="btn" data-scope="all">All time</button>
      </div>
    </div>

    <div class="board" id="board"><div class="state">Loading&hellip;</div></div>
    <div class="you-card hidden" id="youCard"></div>
    <div class="cta hidden" id="cta">Playing as a guest? <a href="index.html">Sign up</a> to save your runs and appear here.</div>
    <div class="note">Each player appears once, with their best run. Ties go to the higher accuracy.</div>
  </main>

<script>
  (function () {
    var A = window.CR_AUTH;
    var $ = function (id) { return document.getElementById(id); };
    var board = $('board'), youCard = $('youCard'), cta = $('cta');
    var dur = 15, scope = 'week', myName = null, signedIn = false, token = 0;

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function state(title, text) {
      board.textContent = '';
      var d = el('div', 'state');
      d.appendChild(el('b', null, title));
      d.appendChild(document.createTextNode(text));
      board.appendChild(d);
    }

    function render(rows, mine) {
      board.textContent = '';
      youCard.classList.add('hidden');
      if (!rows.length) {
        state('No runs on this board yet', scope === 'week' ? 'Set a time in the last 7 days and you could be first.' : 'Be the first to set a time.');
      } else {
        var head = el('div', 'row head');
        ['#', 'Player', 'Acc', 'WPM'].forEach(function (t, i) {
          var c = el('span', i > 1 ? 'acc' : '', t);
          if (i === 3) c.style.textAlign = 'right';
          head.appendChild(c);
        });
        board.appendChild(head);
        var inList = false;
        rows.forEach(function (r) {
          var isMe = myName && r.username && r.username.toLowerCase() === myName.toLowerCase();
          if (isMe) inList = true;
          var row = el('div', 'row' + (r.rank <= 3 ? ' r' + r.rank : '') + (isMe ? ' me' : ''));
          row.appendChild(el('span', 'rk', String(r.rank)));
          var nm = el('span', 'nm');
          nm.appendChild(el('span', 'nm-text', r.username));
          if (isMe) nm.appendChild(el('span', 'you-tag', 'YOU'));
          row.appendChild(nm);
          row.appendChild(el('span', 'acc', r.accuracy + '%'));
          row.appendChild(el('span', 'wp', String(r.wpm)));
          board.appendChild(row);
        });
        if (signedIn && mine && !inList) {
          youCard.classList.remove('hidden');
          youCard.textContent = 'Your rank: ';
          youCard.appendChild(el('b', null, '#' + mine.rank));
          youCard.appendChild(document.createTextNode(' with ' + mine.wpm + ' wpm'));
        }
      }
      if (signedIn && !mine) {
        youCard.classList.remove('hidden');
        youCard.textContent = "You haven't set a " + dur + 's time ' + (scope === 'week' ? 'this week' : 'yet') + '. Play a run to get on the board.';
      }
    }

    function load() {
      var mine = ++token;
      youCard.classList.add('hidden');
      state('Loading\u2026', '');
      var since = scope === 'week' ? A.weekStart() : null;
      Promise.all([
        A.leaderboard(dur, since, 25),
        signedIn ? A.myRank(dur, since).catch(function () { return null; }) : Promise.resolve(null)
      ]).then(function (res) {
        if (mine !== token) return;   // a newer click already replaced this request
        render(res[0], res[1]);
      }).catch(function (err) {
        if (mine !== token) return;
        console.error(err);
        state("Couldn't load the leaderboard", 'Please try again in a moment.');
      });
    }

    function wire(segId, attr, setter) {
      $(segId).addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        $(segId).querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
        setter(b.dataset[attr]);
        load();
      });
    }
    wire('durSeg', 'dur', function (v) { dur = parseInt(v, 10); });
    wire('scopeSeg', 'scope', function (v) { scope = v; });

    if (!A || !A.configured) {
      state('Leaderboard unavailable', 'Accounts are not connected yet, so there are no scores to show.');
      return;
    }
    A.getSession().then(function (session) {
      if (session) { signedIn = true; myName = A.displayName(session.user); }
      else { cta.classList.remove('hidden'); }
      load();
    });
  })();
</script>
</body>
</html>
