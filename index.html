<title>Castle Rush — Log in</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
  :root{
    --stone:#15131A;
    --stone-raised:#1D1A24;
    --panel:#221E2C;
    --panel-line:#362F42;
    --parchment:#EDE7DA;
    --parchment-dim:#9C93A8;
    --ember:#FF7A45;
    --ember-dim:#7A3D22;
    --gold:#E3B341;
    --danger:#E85C5C;
    --correct:#5FD08A;
    --display:'Space Grotesk', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--stone);color:var(--parchment);font-family:var(--display);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;
    background-image:
      radial-gradient(circle at 12% 0%, rgba(255,122,69,0.08), transparent 42%),
      radial-gradient(circle at 88% 8%, rgba(139,124,246,0.08), transparent 42%);
  }
  .hidden{display:none !important;}

  .hero{text-align:center;margin-bottom:22px;}
  .logo-img{display:block;height:190px;width:auto;margin:0 auto 6px;}
  .tagline{font-family:var(--mono);font-size:13px;color:var(--parchment-dim);}

  .auth-card{
    width:100%;max-width:420px;background:var(--panel);border:1px solid var(--panel-line);
    border-radius:16px;padding:26px 28px 24px;
  }

  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--stone);border:1px solid var(--panel-line);border-radius:10px;padding:4px;margin-bottom:20px;}
  .tab{
    font-family:var(--display);font-weight:600;font-size:14px;color:var(--parchment-dim);
    background:none;border:none;border-radius:7px;padding:10px;cursor:pointer;transition:background .15s,color .15s;
  }
  .tab:hover{color:var(--parchment);}
  .tab.active{background:var(--panel);color:var(--parchment);box-shadow:0 0 0 1px var(--panel-line);}

  .notice{
    font-size:13px;line-height:1.5;border-radius:8px;padding:10px 12px;margin-bottom:16px;
    border:1px solid var(--panel-line);background:var(--stone);color:var(--parchment-dim);
  }
  .notice.error{color:#FF9B9B;border-color:rgba(232,92,92,0.5);background:rgba(232,92,92,0.1);}
  .notice.success{color:var(--correct);border-color:rgba(95,208,138,0.45);background:rgba(95,208,138,0.1);}
  .notice.setup{color:var(--gold);border-color:rgba(227,179,65,0.4);background:rgba(227,179,65,0.08);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--parchment-dim);margin-bottom:6px;}
  .input{
    width:100%;font-family:var(--display);font-size:15px;color:var(--parchment);
    background:var(--stone);border:1px solid var(--panel-line);border-radius:9px;padding:12px 14px;outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .input::placeholder{color:#5E566D;}
  .input:focus{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,122,69,0.15);}
  .input.invalid{border-color:var(--danger);}
  .pw{position:relative;}
  .pw .input{padding-right:64px;}
  .pw-toggle{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--parchment-dim);font-family:var(--mono);font-size:11px;cursor:pointer;padding:6px 8px;
  }
  .pw-toggle:hover{color:var(--parchment);}
  .hint{font-family:var(--mono);font-size:11px;color:#6F6781;margin-top:6px;}

  .btn{
    width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:var(--display);font-weight:600;font-size:15px;border-radius:10px;padding:13px 18px;cursor:pointer;
    border:1px solid var(--panel-line);background:var(--stone-raised);color:var(--parchment);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px);}
  .btn:disabled{opacity:0.6;cursor:wait;}
  .btn.primary{background:linear-gradient(180deg,#FF9463,var(--ember));border-color:var(--ember-dim);color:#2A1206;margin-top:6px;}
  .btn.primary:hover:not(:disabled){box-shadow:0 10px 28px -10px rgba(255,122,69,0.55);}
  .btn.guest:hover:not(:disabled){border-color:var(--ember);}

  .divider{display:flex;align-items:center;gap:12px;margin:20px 0 16px;color:var(--parchment-dim);font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--panel-line);}
  .guest-note{font-family:var(--mono);font-size:11px;color:#6F6781;text-align:center;margin-top:10px;line-height:1.5;}
  .foot{margin-top:20px;font-family:var(--mono);font-size:11px;color:#5E566D;text-align:center;}

  @media(max-width:480px){
    .logo-img{height:150px;}
    .auth-card{padding:22px 18px 20px;}
  }
</style>
</head>

    <div class="tagline">type your way to the top</div>

  <main class="auth-card">
    <div class="tabs" role="tablist">
      <button class="tab active" id="tabLogin" role="tab" aria-selected="true" data-tab="login" type="button">Log in</button>
      <button class="tab" id="tabSignup" role="tab" aria-selected="false" data-tab="signup" type="button">Sign up</button>
    </div>

    <div class="notice setup hidden" id="setupNote"></div>
    <div class="notice hidden" id="notice" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input class="input" id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <div class="pw">
          <input class="input" id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password">
          <button class="pw-toggle" type="button" data-target="loginPassword">show</button>
        </div>
      </div>
      <button class="btn primary" id="loginSubmit" type="submit">Log in</button>
    </form>

    <form id="signupForm" class="hidden" novalidate>
      <div class="field">
        <label for="signupUsername">Username</label>
        <input class="input" id="signupUsername" type="text" autocomplete="username" maxlength="16" placeholder="e.g. keysmith">
        <div class="hint">3–16 characters: letters, numbers, underscore</div>
      </div>
      <div class="field">
        <label for="signupEmail">Email</label>
        <input class="input" id="signupEmail" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="signupPassword">Password</label>
        <div class="pw">
          <input class="input" id="signupPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters">
          <button class="pw-toggle" type="button" data-target="signupPassword">show</button>
        </div>
      </div>
      <div class="field">
        <label for="signupConfirm">Confirm password</label>
        <input class="input" id="signupConfirm" type="password" autocomplete="new-password" placeholder="Type it again">
      </div>
      <button class="btn primary" id="signupSubmit" type="submit">Create account</button>
    </form>

    <div class="divider"><span>or</span></div>
    <button class="btn guest" id="guestBtn" type="button">Play as guest</button>
    <p class="guest-note">No account needed. Guest scores stay on this device.</p>
  </main>

  <p class="foot">Castle Rush &middot; free to play</p>

<script>
  (function () {
    var A = window.CR_AUTH;
    var $ = function (id) { return document.getElementById(id); };

    var tabLogin = $('tabLogin'), tabSignup = $('tabSignup');
    var loginForm = $('loginForm'), signupForm = $('signupForm');
    var notice = $('notice'), setupNote = $('setupNote');

    // ---- if accounts aren't connected yet, say so (guest mode still works) ----
    if (!A || !A.configured) {
      setupNote.classList.remove('hidden');
      setupNote.textContent = (A && A.reason === 'no-library')
        ? 'Could not load the account service. Check your connection and refresh. Guest mode still works.'
        : 'Accounts are not connected yet. Guest mode works now.';
    }

    // ---- already logged in? go straight to the game ----
    if (A && A.configured) {
      A.getSession().then(function (session) {
        if (session) location.replace('play.html');
      });
    }

    // ---- tabs ----
    function showTab(which) {
      var isLogin = which === 'login';
      tabLogin.classList.toggle('active', isLogin);
      tabSignup.classList.toggle('active', !isLogin);
      tabLogin.setAttribute('aria-selected', String(isLogin));
      tabSignup.setAttribute('aria-selected', String(!isLogin));
      loginForm.classList.toggle('hidden', !isLogin);
      signupForm.classList.toggle('hidden', isLogin);
      clearNotice();
      clearInvalid();
    }
    tabLogin.addEventListener('click', function () { showTab('login'); });
    tabSignup.addEventListener('click', function () { showTab('signup'); });

    // ---- helpers ----
    function showNotice(kind, text) {
      notice.className = 'notice ' + kind;
      notice.textContent = text;
    }
    function clearNotice() { notice.className = 'notice hidden'; notice.textContent = ''; }
    function clearInvalid() {
      document.querySelectorAll('.input.invalid').forEach(function (el) { el.classList.remove('invalid'); });
    }
    function invalid(id, text) {
      $(id).classList.add('invalid');
      $(id).focus();
      showNotice('error', text);
      return false;
    }
    function setBusy(btn, busy, idleText, busyText) {
      btn.disabled = busy;
      btn.textContent = busy ? busyText : idleText;
    }
    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // ---- show / hide password ----
    document.querySelectorAll('.pw-toggle').forEach(function (b) {
      b.addEventListener('click', function () {
        var input = $(b.dataset.target);
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        b.textContent = show ? 'hide' : 'show';
      });
    });

    // ---- friendly error messages ----
    function friendly(err) {
      var m = ((err && err.message) || '').toLowerCase();
      if (m.indexOf('username_taken') !== -1) return 'That username is already taken. Try another one.';
      if (m.indexOf('invalid login') !== -1) return 'That email and password do not match.';
      if (m.indexOf('already registered') !== -1 || m.indexOf('already been registered') !== -1) return 'An account with that email already exists. Try logging in instead.';
      if (m.indexOf('not confirmed') !== -1) return 'Please confirm your email first. Check your inbox for the link.';
      if (m.indexOf('rate limit') !== -1 || m.indexOf('too many') !== -1) return 'Too many attempts. Please wait a minute and try again.';
      if (m.indexOf('password') !== -1 && m.indexOf('least') !== -1) return 'Password is too short. Use at least 8 characters.';
      if (m.indexOf('fetch') !== -1 || m.indexOf('network') !== -1) return 'Could not reach the server. Check your connection and try again.';
      return (err && err.message) || 'Something went wrong. Please try again.';
    }
    function needAccounts() {
      showNotice('setup', 'Accounts are not connected yet, so logging in is unavailable right now. You can still play as a guest.');
    }

    // ---- log in ----
    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      clearNotice(); clearInvalid();
      var email = $('loginEmail').value.trim();
      var password = $('loginPassword').value;
      if (!EMAIL_RE.test(email)) return invalid('loginEmail', 'Enter a valid email address.');
      if (!password) return invalid('loginPassword', 'Enter your password.');
      if (!A || !A.configured) return needAccounts();

      var btn = $('loginSubmit');
      setBusy(btn, true, 'Log in', 'Logging in…');
      A.client.auth.signInWithPassword({ email: email, password: password })
        .then(function (res) {
          if (res.error) throw res.error;
          A.clearGuest();
          location.replace('play.html');
        })
        .catch(function (err) {
          showNotice('error', friendly(err));
          setBusy(btn, false, 'Log in', 'Logging in…');
        });
    });

    // ---- sign up ----
    signupForm.addEventListener('submit', function (e) {
      e.preventDefault();
      clearNotice(); clearInvalid();
      var username = $('signupUsername').value.trim();
      var email = $('signupEmail').value.trim();
      var password = $('signupPassword').value;
      var confirm = $('signupConfirm').value;
      if (!/^[A-Za-z0-9_]{3,16}$/.test(username)) return invalid('signupUsername', 'Username must be 3–16 characters: letters, numbers or underscore.');
      if (!EMAIL_RE.test(email)) return invalid('signupEmail', 'Enter a valid email address.');
      if (password.length < 8) return invalid('signupPassword', 'Password must be at least 8 characters.');
      if (password !== confirm) return invalid('signupConfirm', 'The two passwords do not match.');
      if (!A || !A.configured) return needAccounts();

      var btn = $('signupSubmit');
      setBusy(btn, true, 'Create account', 'Creating account…');
      A.usernameAvailable(username)
        .then(function (free) {
          if (free === false) { throw new Error('USERNAME_TAKEN'); }
        }, function () { /* the lookup is unavailable: do not block sign-up */ })
        .then(function () {
          return A.client.auth.signUp({ email: email, password: password, options: { data: { username: username } } });
        })
        .then(function (res) {
          if (res.error) throw res.error;
          var user = res.data && res.data.user;
          // Supabase returns an empty identities list when the email is already registered
          if (user && user.identities && user.identities.length === 0) {
            throw new Error('User already registered');
          }
          if (res.data && res.data.session) {          // email confirmation is off: logged in immediately
            A.clearGuest();
            location.replace('play.html');
            return;
          }
          // email confirmation is on: ask the player to confirm, then log in
          showTab('login');
          $('loginEmail').value = email;
          showNotice('success', 'Account created! Check your email to confirm it, then log in.');
          setBusy(btn, false, 'Create account', 'Creating account…');
        })
        .catch(function (err) {
          if (err && err.message === 'USERNAME_TAKEN') { $('signupUsername').classList.add('invalid'); $('signupUsername').focus(); }
          showNotice('error', friendly(err));
          setBusy(btn, false, 'Create account', 'Creating account…');
        });
    });

    // ---- guest ----
    $('guestBtn').addEventListener('click', function () {
      if (A) A.enterGuest();
      location.href = 'play.html';
    });
  })();
</script>
</body>
</html>
